<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>Bootstrap demo</title> -->
    <title> CALAPAQUI </title>

     <!-- Bootstrap -->
      <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h5 class="text-center mb-4">
        Ejercicios JavaScript de clase
    </h1>

    <!-- EJERCICIO 1 -->
    <div class="card p-3 mb-4">

        <h5> Doble de un numero</h5>

        <input type="number"
               id="numero"
               class="form-control mb-2"
               placeholder="Ingrese un numero">

        <button class="btn btn-primary"
                onclick="calcularDoble()">
            Calcular
        </button>

        <p class="mt-2" id="resultadoDoble"></p>

    </div>

    <!-- EJERCICIO 2 -->
    <div class="card p-3 mb-4">

        <h5>Numero Palindromo</h5>

        <input type="text"
               id="palindromo"
               class="form-control mb-2"
               placeholder="Ingrese  numero">

        <button class="btn btn-primary" onclick="verificarPalindromo()">
            Verificar
        </button>

        <p class="mt-2" id="resultadoPalindromo"></p>

    </div>

    <!-- EJERCICIO 3 -->
    <div class="card p-3 mb-4">

        <h5>Contador automatico</h5>

        <button class="btn btn-primary" onclick="incrementarContador()">
            Contar
        </button>

        <p class="mt-2">
            Contador:
            <span id="contador">0</span>
        </p>

    </div>

    <!-- EJERCICIO 4 -->
    <div class="card p-3 mb-4">

        <h5>Lista de tareas</h5>

        <input type="text"
               id="tarea"
               class="form-control mb-2"
               placeholder="Ingrese una tarea">

        <button class="btn btn-primary" onclick="agregarTarea()">
            Agregar
        </button>

        <ul class="mt-3" id="listaTareas"></ul>

    </div>

</div>




<!-- Archivo JavaScript -->
<script src="scritps/functions.js"></script>

</body>

</html>
