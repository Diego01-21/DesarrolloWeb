<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo Promesas</title>
</head>
<body>

    <button id="btn">Ejecutar tarea</button>

    <script>
        function tarea() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    let exito = true;

                    if (exito) {
                        resolve("✅ Tarea completada");
                    } else {
                        reject("❌ Error en la tarea");
                    }
                }, 2000);
            });
        }

        document.getElementById("btn").addEventListener("click", () => {
            tarea()
                .then(resultado => alert(resultado))
                .catch(error => alert(error));
        });
    </script>

</body>
</html>
